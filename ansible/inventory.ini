# Inventory for Enterprise Storage & Disaster Recovery Lab

[storage_servers]
nfs-server-01 ansible_host=192.168.10.10 ansible_user=devops_admin

[storage_clients]
client-node-01 ansible_host=192.168.10.21 ansible_user=devops_admin
client-node-02 ansible_host=192.168.10.22 ansible_user=devops_admin

[backup_targets]
dr-backup-node ansible_host=192.168.10.30 ansible_user=devops_admin

[all:vars]
ansible_ssh_private_key_file=~/.ssh/storage_lab_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
storage_subnet="192.168.10.0/24"
nfs_export_path="/srv/nfs_share"
nfs_client_mount="/mnt/shared_data"
nfs_server_ip="192.168.10.10"
vg_name="vg_storage"
lv_name="lv_data"
storage_disk="/dev/sdb"
