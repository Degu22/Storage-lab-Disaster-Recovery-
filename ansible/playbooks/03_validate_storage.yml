---
- name: Enterprise Storage Service - Security & Access Validation Suite
  hosts: storage_clients
  become: true
  tasks:
    - name: Test write operations as standard unprivileged user
      ansible.builtin.copy:
        content: "Enterprise storage write integrity check timestamp: {{ ansible_date_time.iso8601 }}\n"
        dest: "{{ nfs_client_mount }}/client_access_test_{{ inventory_hostname }}.txt"
        mode: '0644'

    - name: Test DevSecOps root_squash protection (simulate client root file creation)
      ansible.builtin.file:
        path: "{{ nfs_client_mount }}/root_security_check_{{ inventory_hostname }}.tmp"
        state: touch
        mode: '0644'

    - name: Inspect ownership of the root-created file to verify squashing
      ansible.builtin.stat:
        path: "{{ nfs_client_mount }}/root_security_check_{{ inventory_hostname }}.tmp"
      register: root_file_stat

    - name: Assert root_squash successfully prevented root UID (0) escalation
      ansible.builtin.assert:
        that:
          - root_file_stat.stat.uid != 0
        fail_msg: "CRITICAL SECURITY RISK: root_squash is inactive! Root user created a file with UID 0."
        success_msg: "SECURITY PASSED: root_squash active. Root mapped to unprivileged UID ({{ root_file_stat.stat.uid }})."

    - name: Clean up temporary validation file
      ansible.builtin.file:
        path: "{{ nfs_client_mount }}/root_security_check_{{ inventory_hostname }}.tmp"
        state: absent
