---
# Management & Monitoring Node Setup (Prometheus & Grafana)
- name: Configure Prometheus & Grafana on Management Node
  hosts: management_servers
  become: true
  tasks:
    - name: Install Prometheus and Alertmanager packages
      ansible.builtin.apt:
        name:
          - prometheus
          - prometheus-alertmanager
        state: present

    - name: Allow Prometheus port 9090 and Alertmanager port 9093 in UFW
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '9090'
        - '9093'
        - '3000'

    - name: Install Grafana GPG key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg.key
        dest: /etc/apt/keyrings/grafana.asc
        mode: '0644'

    - name: Add Grafana repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
        state: present
        filename: grafana

    - name: Install Grafana package
      ansible.builtin.apt:
        name: grafana
        state: present
        update_cache: true

    - name: Ensure Grafana service is running and enabled
      ansible.builtin.systemd:
        name: grafana-server
        state: started
        enabled: true
