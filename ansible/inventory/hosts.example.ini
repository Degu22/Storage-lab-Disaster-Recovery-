# ==============================================================================
# Ansible Inventory Example - Enterprise Storage & Disaster Recovery Lab
# ==============================================================================
# Architecture Option B: Ansible runs from the Management Node (or via SSH bastion
# ProxyJump) connecting to private storage and client nodes over internal IPs.
# Copy this file to 'hosts.ini' and update the IP addresses from terraform output.

[management_servers]
# Management Node (Ansible control node, Prometheus, Grafana)
mgmt-01 ansible_host=10.0.1.10 private_ip=10.0.1.10 ansible_user=ubuntu

[storage_servers]
# NFS Storage Server in private subnet (reachable via Management node)
nfs-server-01 ansible_host=10.0.2.10 private_ip=10.0.2.10 ansible_user=ubuntu

[storage_clients]
# NFS Client Node in private subnet (reachable via Management node)
nfs-client-01 ansible_host=10.0.2.20 private_ip=10.0.2.20 ansible_user=ubuntu

[all:vars]
ansible_ssh_private_key_file=~/.ssh/storage-lab-key.pem
ansible_python_interpreter=/usr/bin/python3
storage_subnet="10.0.2.0/24"
management_subnet="10.0.1.0/24"
nfs_export_path="/srv/nfs_share"
nfs_client_mount="/mnt/nfs_share"
nfs_server_private_ip="10.0.2.10"
vg_name="vg_storage"
lv_name="lv_data"
# EBS NVMe block device name or persistent symlink
storage_device_candidate="/dev/nvme1n1"

# NOTE: If executing Ansible from an external administrative workstation rather than
# the Management Node directly, configure ProxyJump in ~/.ssh/config:
#   Host 10.0.2.*
#       ProxyJump ubuntu@<MANAGEMENT_NODE_PUBLIC_IP>
#       IdentityFile ~/.ssh/storage-lab-key.pem
