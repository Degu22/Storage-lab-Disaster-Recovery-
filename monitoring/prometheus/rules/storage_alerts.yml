groups:
  - name: storage_service_alerts
    rules:
      - alert: StorageNodeUnavailable
        expr: up{job="storage_nodes"} == 0
        for: 1m
        labels:
          severity: critical
          tier: infrastructure
        annotations:
          summary: "Storage Node Exporter is unreachable"
          description: "Target {{ $labels.instance }} has been down for more than 1 minute."

      - alert: StorageVolumeNearCapacity
        expr: (node_filesystem_avail_bytes{mountpoint="/srv/nfs_share"} / node_filesystem_size_bytes{mountpoint="/srv/nfs_share"}) < 0.20
        for: 5m
        labels:
          severity: warning
          tier: storage
        annotations:
          summary: "NFS Storage Volume capacity crossed 80%"
          description: "Storage pool on {{ $labels.instance }} has only {{ $value | humanizePercentage }} available space remaining."

      - alert: StorageVolumeCriticallyFull
        expr: (node_filesystem_avail_bytes{mountpoint="/srv/nfs_share"} / node_filesystem_size_bytes{mountpoint="/srv/nfs_share"}) < 0.10
        for: 2m
        labels:
          severity: critical
          tier: storage
        annotations:
          summary: "CRITICAL: NFS Storage Volume capacity crossed 90%"
          description: "Storage pool on {{ $labels.instance }} has less than 10% space remaining. Emergency intervention required."

      - alert: StorageInodesExhaustion
        expr: (node_filesystem_files_free{mountpoint="/srv/nfs_share"} / node_filesystem_files{mountpoint="/srv/nfs_share"}) < 0.15
        for: 5m
        labels:
          severity: warning
          tier: storage
        annotations:
          summary: "NFS Filesystem Inodes < 15%"
          description: "Inode table on {{ $labels.instance }} is near exhaustion."

      - alert: HighDiskWaitLatency
        expr: (rate(node_disk_read_time_seconds_total[5m]) / rate(node_disk_reads_completed_total[5m])) > 0.050
        for: 5m
        labels:
          severity: warning
          tier: storage
        annotations:
          summary: "High storage I/O wait latency (>50ms)"
          description: "Disk I/O latency on {{ $labels.instance }} is exceeding 50ms average."
