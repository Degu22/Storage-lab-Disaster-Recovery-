global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/storage_alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - '127.0.0.1:9093' # Local Alertmanager daemon

scrape_configs:
  - job_name: 'prometheus_self'
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: 'storage_nodes'
    static_configs:
      - targets:
          - '127.0.0.1:9100'    # Management & Monitoring Node
          - '10.0.2.10:9100'    # NFS Storage Server
          - '10.0.2.20:9100'    # NFS Client Node
        labels:
          environment: 'storage_lab'
          tier: 'enterprise_storage'
