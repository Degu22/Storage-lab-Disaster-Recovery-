global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "storage_alerts.rules.yml"

scrape_configs:
  - job_name: 'storage_node_exporter'
    static_configs:
      - targets:
          - '192.168.10.10:9100'  # NFS Storage Server
          - '192.168.10.21:9100'  # Client Node 01
          - '192.168.10.22:9100'  # Client Node 02
          - '192.168.10.30:9100'  # DR Backup Target
        labels:
          environment: 'enterprise_storage_lab'
          tier: 'storage_infrastructure'
